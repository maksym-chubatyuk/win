		A5358830309CE3DD00A12248 /* Bundle Wine runtime */ = {
			isa = PBXShellScriptBuildPhase;
			buildActionMask = 2147483647;
			files = (
			);
			inputPaths = (
			);
			name = "Bundle Wine runtime";
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "set -e\nSRC=\"$SRCROOT/third_party/madeira/app/Madeira\"\nDEST=\"$TARGET_BUILD_DIR/$WRAPPER_NAME\"\n# NVAPI is left out: here it can only answer \"no NVIDIA GPU\", a path real PCs never take\n# (without an NVIDIA card the DLL does not exist), and Superposition crashed on it.\n# i386-windows is the 32-bit (WoW64) DLL set from build/wine-i386/build.sh; without its\n# ntdll.dll the app treats 32-bit programs as unsupported.\nrsync -a --delete --delete-excluded --exclude nvapi64.dll --exclude nvapi.dll --exclude .gitkeep \"$SRC/aarch64-windows\" \"$SRC/arm64ec-windows\" \"$SRC/i386-windows\" \"$SRC/nls\" \"$DEST/\"\ncp \"$SRC/prefix-template.tar.gz\" \"$DEST/\"\n# gl/: Mesa's OSMesa with Zink (desktop OpenGL) and MoltenVK (Vulkan on Metal), from\n# tools/build/prepare-graphics.sh moltenvk|zink. vulkan/: winevulkan.dll and vulkan-1.dll.\n# Madeira's launcher picks Zink and turns Vulkan on when these are present.\nfor d in gl vulkan; do if [ -d \"$SRC/$d\" ]; then rsync -a --delete \"$SRC/$d\" \"$DEST/\"; fi; done\n# dyld only loads a dylib whose own signature is valid; the app's signature seals but does\n# not re-sign loose dylibs, so each is signed with this build's identity.\nfor DYLIB in \"$DEST\"/gl/*.dylib; do\n  [ -f \"$DYLIB\" ] || continue\n  if [ -n \"$EXPANDED_CODE_SIGN_IDENTITY\" ] && [ \"$CODE_SIGNING_ALLOWED\" != \"NO\" ]; then\n    codesign --force --sign \"$EXPANDED_CODE_SIGN_IDENTITY\" --timestamp=none \"$DYLIB\"\n  else\n    codesign --force --sign - \"$DYLIB\"\n  fi\ndone\ncp \"$SRC/madeira-jit.js\" \"$DEST/\"\nGUEST=\"$SRCROOT/build/guest\"\nfor exe in \"$GUEST\"/*-x64.exe; do if [ -f \"$exe\" ]; then cp \"$exe\" \"$DEST/arm64ec-windows/\"; fi; done\nfor exe in \"$GUEST\"/*-arm64.exe; do if [ -f \"$exe\" ]; then cp \"$exe\" \"$DEST/aarch64-windows/\"; fi; done\nfor exe in \"$GUEST\"/*-x86.exe; do if [ -f \"$exe\" ]; then cp \"$exe\" \"$DEST/i386-windows/\"; fi; done\n";
		};
